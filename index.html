<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#E65100">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="제주트렌드">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>JEJU TREND</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Noto Sans KR',sans-serif;background:#F7F8FA;color:#1A1A1A;min-height:100vh;overscroll-behavior:none}
button{font-family:inherit;cursor:pointer;border:none;background:none}
a{text-decoration:none;color:inherit}
::-webkit-scrollbar{display:none}
.app{max-width:640px;margin:0 auto}

/* 헤더 */
.hdr{padding:11px 15px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100}
.hdr-logo{display:flex;align-items:center;gap:8px}
.hdr-title{font-size:14px;font-weight:700;color:#fff;letter-spacing:1px}
.hdr-sub{font-size:9px;color:rgba(255,255,255,0.85);margin-top:1px}
.hdr-badge{background:rgba(255,255,255,0.22);color:#fff;font-size:9px;padding:2px 8px;border-radius:20px;font-weight:600}

/* 배너 */
.banner{background:#E3F2FD;padding:5px 14px;font-size:9px;color:#1565C0;text-align:center}

/* 탭 */
.tab-bar{display:flex;background:#fff;border-bottom:1px solid #EBEBEB}
.tab-btn{flex:1;padding:10px 4px;font-size:11px;font-weight:700;border-bottom:3px solid transparent;transition:color .2s}
.tab-btn.active{border-bottom-color:var(--rc)}

/* 주차 선택 */
.week-bar{display:flex;gap:5px;padding:8px 12px;background:#fff;border-bottom:1px solid #EBEBEB;overflow-x:auto}
.week-btn{flex:0 0 auto;padding:5px 9px;border-radius:8px;border:1.5px solid #EBEBEB;background:#fff}
.week-btn.active{border-color:var(--rc);background:var(--rl)}
.week-btn .wl{font-size:10px;font-weight:700;color:var(--rc)}
.week-btn .wd{font-size:8px;color:#666;margin-top:1px}

/* 권역 탭 */
.region-bar{display:flex;background:#fff;border-bottom:1px solid #EBEBEB}
.region-btn{flex:1;padding:8px 2px 6px;border-bottom:3px solid transparent;text-align:center}
.region-btn.active{border-bottom-color:var(--rc)}
.region-emoji{font-size:13px}
.region-label{font-size:9px;font-weight:700;color:#666;margin-top:2px}
.region-btn.active .region-label{color:var(--rc)}
.region-sub{font-size:7px;color:#999}

/* 컨텐츠 */
.content{padding:13px}

/* 카드들 */
.summary-card{border-radius:12px;padding:12px 14px;margin-bottom:13px;color:#fff}
.summary-label{font-size:9px;font-weight:700;margin-bottom:5px;opacity:.85}
.summary-text{font-size:12px;line-height:1.8}

.section-title{font-size:12px;font-weight:700;margin-bottom:5px}
.section-hint{font-size:9px;color:#666;margin-bottom:9px}

.point-btn{display:flex;align-items:flex-start;gap:10px;width:100%;background:#fff;border-radius:10px;padding:11px 13px;margin-bottom:7px;border:1px solid #C8E6C9;text-align:left}
.point-icon{font-size:18px;flex-shrink:0;margin-top:1px}
.point-label{font-size:11px;font-weight:700;margin-bottom:3px}
.point-text{font-size:10px;color:#666;line-height:1.6}
.point-meta{margin-top:5px;display:flex;align-items:center;gap:4px}
.type-badge{font-size:8px;font-weight:700;padding:1px 6px;border-radius:8px}
.source-text{font-size:8px;color:#999}
.arrow{font-size:10px;color:#2E7D32;margin-left:auto}

.spots-card{border-radius:10px;padding:11px 13px;margin-bottom:13px}
.spots-title{font-size:11px;font-weight:700;margin-bottom:8px}
.spots-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.spot-item{display:flex;align-items:center;gap:5px}
.spot-num{width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;flex-shrink:0;color:#fff}
.spot-name{font-size:10px}

.art-title{font-size:12px;font-weight:700;margin-bottom:8px}
.art-btn{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;width:100%;background:#fff;border-radius:9px;padding:10px 12px;margin-bottom:6px;text-align:left;border-left:3px solid}
.art-meta{display:flex;align-items:center;gap:5px;margin-bottom:3px;flex-wrap:wrap}
.art-headline{font-size:11px;font-weight:700;line-height:1.5;margin-bottom:3px}
.art-summary{font-size:10px;color:#666;line-height:1.5}
.art-arrow{font-size:14px;flex-shrink:0;margin-top:2px}

.note{font-size:9px;color:#999;text-align:center;padding:8px 0 2px;line-height:1.6}

/* 크루즈 */
.facts-section{margin-bottom:13px}
.fact-btn{display:flex;align-items:center;gap:9px;width:100%;background:#fff;border-radius:9px;padding:10px 12px;margin-bottom:6px;border:1px solid #C8E6C9;text-align:left}
.fact-icon{font-size:18px;flex-shrink:0}
.fact-text{flex:1;font-size:11px;line-height:1.5}

.cruise-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:10px}
.stat-card{background:#fff;border-radius:9px;padding:8px;border:1px solid #EBEBEB;text-align:center}
.stat-val{font-size:14px;font-weight:700}
.stat-label{font-size:9px;font-weight:600;margin-top:2px}

.size-legend{display:flex;gap:5px;margin-bottom:9px;flex-wrap:wrap}
.size-badge{font-size:9px;font-weight:700;padding:2px 7px;border-radius:20px}

.port-tabs{display:flex;border-radius:8px;border:1px solid #EBEBEB;margin-bottom:9px;overflow:hidden}
.port-tab{flex:1;padding:8px 5px;text-align:center}
.port-tab .pt-label{font-size:11px;font-weight:700}
.port-tab .pt-sub{font-size:8px;margin-top:1px;opacity:.85}

.ship-list{background:#fff;border-radius:10px;padding:3px 11px;border:1px solid #EBEBEB;margin-bottom:11px}
.ship-row{display:flex;align-items:center;gap:6px;padding:8px 0;border-bottom:1px solid #EBEBEB}
.ship-row:last-child{border-bottom:none}
.ship-flag{font-size:15px;width:20px;text-align:center;flex-shrink:0}
.ship-info{flex:1;min-width:0}
.ship-name{font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ship-meta{font-size:9px;color:#666;margin-top:1px}
.ship-badge{font-size:9px;font-weight:700;padding:2px 6px;border-radius:9px;flex-shrink:0}

/* 팝업 */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:999;display:flex;align-items:flex-end;justify-content:center}
.popup{background:#fff;border-radius:16px 16px 0 0;padding:20px 20px 40px;width:100%;max-width:640px;box-shadow:0 -4px 20px rgba(0,0,0,.15)}
.popup-handle{width:36px;height:4px;background:#ddd;border-radius:2px;margin:0 auto 16px}
.popup-badge{font-size:10px;font-weight:700;padding:3px 10px;border-radius:12px;display:inline-block;margin-bottom:10px}
.popup-source{font-size:11px;font-weight:700;color:#666;margin-bottom:4px}
.popup-date{font-size:10px;color:#bbb;margin-left:6px}
.popup-title{font-size:14px;font-weight:700;line-height:1.6;margin-bottom:8px}
.popup-summary{font-size:12px;color:#666;line-height:1.7;margin-bottom:14px;padding:10px 12px;background:#F8F8F8;border-radius:8px}
.popup-url{font-size:9px;color:#bbb;margin-bottom:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.popup-open{display:block;color:#fff;text-align:center;padding:13px;border-radius:11px;font-size:13px;font-weight:700}
.popup-close{width:100%;padding:11px;color:#666;font-size:12px;margin-top:8px;background:none;border:none}

/* 월 선택 */
.month-bar{display:flex;gap:5px;padding:8px 12px;background:#fff;border-bottom:1px solid #EBEBEB}
.month-btn{flex:1;padding:7px 4px;border-radius:8px;border:1.5px solid #EBEBEB;background:#fff;font-size:10px;font-weight:700}
.month-btn.active{border-color:var(--rc);background:var(--rl)}

.month-badge{font-size:9px;color:#fff;padding:1px 6px;border-radius:10px;display:inline-block;margin-left:4px}

.empty{text-align:center;padding:40px 0;color:#666;font-size:13px}
</style>
</head>

  A06:{title:"올해 제주 크루즈 관광객 80만명 온다…성장 국면 진입",source:"제주도민일보",date:"2026.01.20",url:"https://www.jejudomin.co.kr/news/articleView.html?idxno=316424",type:"news",summary:"크루즈 최근 3년: 2023년 71회·10만명 → 2024년 274회·64만명 → 2025년 321회·75만명. 무인 자동심사대 38대(제주항 10·강정항 28) 도입, 입국 150분→60분 단축."},

  A08:{title:"'위기는 기회' 중동 사태발 고유가 제주 관광 반사이익 기대",source:"CBS제주(네이트)",date:"2026.04.06",url:"https://news.nate.com/view/20260407n28696",type:"news",summary:"제주대 관광융복합학과 김영민 교수 인터뷰. 중동 사태 고유가로 외국인 감소 우려, 내국인 반사이익 '조심스러운 기대'. 반값여행 전국 확대 검토 언급."},
  A12:{title:"계속되는 관광객 감소…돌파구 마련해야",source:"제주일보",date:"2025.03",url:"https://jejunews.com/news/articleView.html?idxno=2217189",type:"news",summary:"2025년 3월 제주 내국인 관광객 2019년 대비 24% 감소. 5년 만에 최저치. 제주도, 여행지원금·팝업 이벤트·관광물가지수 도입 등 4대 핵심사업 추진."},
  A13:{title:"제주 관광, 외국인 관광객이 지탱",source:"문화일보",date:"2026.01.04",url:"https://www.munhwa.com/article/11558380",type:"news",summary:"2025년 제주 외국인 224만명(+17.7%), 내국인 1160만명(-2.2%). 크루즈·국제선 확대로 외국인이 전체 성장 견인."},
  A14:{title:"'돌아오는 취소표 구해요'…5월 황금연휴에 들썩이는 제주",source:"한국경제(다음뉴스)",date:"2026.04.22",url:"https://v.daum.net/v/20260422212502601",type:"news",summary:"5월 1~5일 황금연휴 제주 입도객 전년比 3.8% 증가. 국내선 유류할증료 4.4배 급등으로 4인 왕복 27만2800원 부담. 1일·2일 김포발 항공권 대부분 매진, 취소표 경쟁 발생. 업계 '중동 전쟁 유류할증료 역설적으로 제주 수요 끌어올릴 것' 기대."},

function renderFestivals(periodKey, regionLabel) {
  const fests = (FESTIVALS[periodKey] || []).filter(f => f.region === regionLabel);
  if (!fests.length) return '';
  const hasEvent = fests.some(f => f.type === 'event');
  const hasFest = fests.some(f => f.type === 'festival');
  let title = hasFest && hasEvent ? '🎪 이 기간 축제·주요 행사' : hasEvent ? '🏅 이 기간 주요 행사' : '🎪 이 기간 축제';
  let html = '<div style="background:#fff;border-radius:10px;padding:11px 13px;margin-bottom:13px;border:1px solid #EBEBEB">';
  html += '<div style="font-size:11px;font-weight:700;color:#C62828;margin-bottom:8px">' + title + '</div>';
  fests.forEach(f => {
    const isEvent = f.type === 'event';
    const color = isEvent ? '#1565C0' : '#C62828';
    const bg = isEvent ? '#E3F2FD' : '#FFF0F0';
    html += '<a href="' + f.url + '" target="_blank" rel="noopener" style="display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid #F5F5F5;text-decoration:none">';
    html += '<span style="font-size:16px;flex-shrink:0">' + (f.emoji || '🎪') + '</span>';
    html += '<div style="flex:1">';
    html += '<div style="display:flex;align-items:center;gap:4px;margin-bottom:2px">';
    html += '<span style="font-size:8px;font-weight:700;color:' + color + ';background:' + bg + ';padding:1px 4px;border-radius:3px">' + (isEvent ? '행사' : '축제') + '</span>';
    html += '</div>';
    html += '<div style="font-size:11px;font-weight:700;color:#1A1A1A">' + f.name + '</div>';
    html += '<div style="font-size:9px;color:#666;margin-top:2px">' + f.date + ' · ' + f.area + '</div></div>';
    html += '<span style="font-size:10px;color:' + color + '">↗</span></a>';
  });
  html += '</div>';
  return html;
}

// ── 현재 주차·월 자동 감지
function getCurrentPeriodId() {
  const now = new Date();
  const y = now.getFullYear();
  const m = now.getMonth(); // 0-indexed
  const d = now.getDate();
  // 주차 기준 (월요일 시작)
  const weeks = [
    {id:'w1', s:[2026,2,30], e:[2026,3,5]},
    {id:'w2', s:[2026,3,6],  e:[2026,3,12]},
    {id:'w3', s:[2026,3,13], e:[2026,3,19]},
    {id:'w4', s:[2026,3,20], e:[2026,3,26]},
    {id:'w5', s:[2026,3,27], e:[2026,4,3]},
  ];
  for (const w of weeks) {
    const s = new Date(w.s[0], w.s[1], w.s[2]);
    const e = new Date(w.e[0], w.e[1], w.e[2], 23, 59);
    if (now >= s && now <= e) return w.id;
  }
  // 월별 기준
  if (y === 2026 && m === 0) return '2026-01';
  if (y === 2026 && m === 1) return '2026-02';
  if (y === 2026 && m === 2 && d <= 29) return '2026-03';
  // 주차 범위 이후면 가장 최근 주차
  return 'w5';
}

function renderAllRegions(nw,ne,sg,periodKey,periodLabel){

    {d:ne, color:'#1565C0', light:'#E3F2FD', emoji:'🌊', label:'제주동북권', sub:'이도·조천·구좌·성산·우도'},
    {d:sg, color:'#2E7D32', light:'#E8F5E9', emoji:'🌺', label:'서귀포권',   sub:'서귀포·중문·남원·표선'},
  ];

  // ─ 1. 통합 트렌드 요약 (▶마커 파싱 방식)
  function parseRegionFacts(summary) {
    const parts = {main:'', nw:'', ne:'', sg:''};
    if(!summary) return parts;
    const nwIdx = summary.indexOf('▶서북권:');
    const neIdx = summary.indexOf('▶동북권:');
    const sgIdx = summary.indexOf('▶서귀포권:');
    const markers = [[nwIdx,'nw'],[neIdx,'ne'],[sgIdx,'sg']].filter(m=>m[0]>=0).sort((a,b)=>a[0]-b[0]);
    if(markers.length === 0) { parts.main = summary; return parts; }
    parts.main = summary.substring(0, markers[0][0]).trim();
    markers.forEach((m, i) => {
      const start = m[0] + ('▶'+{nw:'서북권',ne:'동북권',sg:'서귀포권'}[m[1]]+':').length;
      const end = i+1 < markers.length ? markers[i+1][0] : summary.length;
      parts[m[1]] = summary.substring(start, end).trim();
    });
    return parts;
  }

  const facts = parseRegionFacts((nw&&nw.summary)||'');
  let html = '';
  html += '<div style="background:#E65100;border-radius:10px;padding:13px 14px;margin-bottom:10px">';
  html += '<div style="font-size:9px;color:rgba(255,255,255,0.8);margin-bottom:6px">🍊 제주 관광 트렌드 요약 · '+periodLabel+'</div>';
  if(facts.main) html += '<div style="font-size:12px;color:#fff;line-height:1.7;font-weight:500">'+facts.main+'</div>';
  if(facts.nw) {
    html += '<div style="margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,0.2)">';
    html += '<div style="font-size:9px;color:rgba(255,255,255,0.7);margin-bottom:3px">🌅 서북권 주요 팩트</div>';
    html += '<div style="font-size:11px;color:rgba(255,255,255,0.9);line-height:1.6">'+facts.nw+'</div></div>';
  }
  if(facts.ne) {
    html += '<div style="margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,0.2)">';
    html += '<div style="font-size:9px;color:rgba(255,255,255,0.7);margin-bottom:3px">🌊 동북권 주요 팩트</div>';
    html += '<div style="font-size:11px;color:rgba(255,255,255,0.9);line-height:1.6">'+facts.ne+'</div></div>';
  }
  if(facts.sg) {
    html += '<div style="margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,0.2)">';
    html += '<div style="font-size:9px;color:rgba(255,255,255,0.7);margin-bottom:3px">🌺 서귀포권 주요 팩트</div>';
    html += '<div style="font-size:11px;color:rgba(255,255,255,0.9);line-height:1.6">'+facts.sg+'</div></div>';
  }
  html += '</div>';

  // ─ 2. 관련 기사·통계 (3개 권역 기사 합쳐서 중복 제거, 최신순)
  const allArts = [...new Set([
    ...(nw.articles||[]), ...(ne.articles||[]), ...(sg.articles||[])
  ])];
  if(allArts.length) {
    html += '<div class="art-title">📰 관련 기사 · 통계</div>';
    allArts.forEach(key => {
      const ref = REFS[key];
      if(!ref) return;
      const t = TYPE[ref.type];
      html += '<button class="art-btn" data-art="'+key+'" style="border-left-color:'+((t&&t.color)||'#ccc')+';background:'+((t&&t.bg)||'#fff')+'08">';
      html += '<div style="flex:1;min-width:0">';
      html += '<div class="art-meta">';
      html += '<span class="type-badge" style="color:'+((t&&t.color))+';background:'+((t&&t.bg))+'">'+((t&&t.emoji))+' '+((t&&t.label))+'</span>';
      html += '<span style="font-size:9px;color:#666;font-weight:600">'+ref.source+'</span>';
      html += '<span style="font-size:8px;color:#bbb">'+ref.date+'</span>';
      html += '</div>';
      html += '<div class="art-headline">'+ref.title+'</div>';
      html += '<div class="art-summary">'+ref.summary+'</div>';
      html += '</div><span class="art-arrow" style="color:'+((t&&t.color))+'">↗</span></button>';
    });
    html += '<div class="note">※ 해당 기간 발행 검증 기사 기반</div>';
  }

  // ─ 3. 축제·행사 (전 권역 통합, 중복제거)
  const allFests = (FESTIVALS[periodKey]||[]);
  if(allFests.length) {
    html += '<div style="background:#fff;border-radius:10px;padding:11px 13px;margin-bottom:10px;border:1px solid #EBEBEB">';
    html += '<div style="font-size:11px;font-weight:700;color:#C62828;margin-bottom:8px">🎪 이 기간 축제·주요 행사</div>';
    const seen = new Set();
    allFests.forEach(f => {
      if(seen.has(f.name)) return;
      seen.add(f.name);
      const isEvent = f.type==='event';
      const color = isEvent?'#1565C0':'#C62828';
      const bg = isEvent?'#E3F2FD':'#FFF0F0';
      html += '<a href="'+f.url+'" target="_blank" rel="noopener" style="display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid #F5F5F5;text-decoration:none">';
      html += '<span style="font-size:15px;flex-shrink:0">'+f.emoji+'</span>';
      html += '<div style="flex:1">';

      html += '<span style="font-size:8px;font-weight:700;color:'+color+';background:'+bg+';padding:1px 4px;border-radius:3px">'+(isEvent?'행사':'축제')+'</span>';

      html += '</div>';
      html += '<div style="font-size:11px;font-weight:700;color:#1A1A1A">'+f.name+'</div>';
      html += '<div style="font-size:9px;color:#666;margin-top:2px">'+f.date+' · '+f.area+'</div></div>';
      html += '<span style="font-size:10px;color:'+color+'">↗</span></a>';
    });
    html += '</div>';
  }

  // ─ 4. 권역별 주요 관광지
  html += '<div style="background:#fff;border-radius:10px;padding:11px 13px;margin-bottom:10px;border:1px solid #EBEBEB">';
  html += '<div style="font-size:11px;font-weight:700;color:#333;margin-bottom:4px">📍 권역별 주요 관광지</div>';

    html += '<div style="font-size:10px;font-weight:700;color:'+r.color+';margin-bottom:5px">'+r.emoji+' '+r.label+'</div>';

  html += '</div>';

  return html;

function renderVisitors(periodKey, periodLabel) {
  const v = VISITORS[periodKey];
  if (!v || !v.daily && !v.monthly && !v.yearly) {
    return '<div style="background:#fff;border-radius:10px;padding:24px;text-align:center;color:#888;font-size:11px;border:1px solid #EBEBEB">'
      + '<div style="font-size:22px;margin-bottom:8px">📊</div>'
      + '<div style="font-weight:700;color:#333;margin-bottom:4px;font-size:12px">' + (v && v.period || periodLabel) + '</div>'
      + '<div style="margin-top:8px">' + (v && v.note || '해당 기간 입도객 데이터가 아직 집계되지 않았습니다.') + '</div>'
      + '<div style="margin-top:10px;font-size:9px;color:#bbb">원본: <a href="https://visitjeju.or.kr/issue/stats/daily.htm" target="_blank" style="color:#1565C0">제주관광협회 일별통계</a></div>'
      + '</div>';
  }

  function fmt(n) { return (n !== null && n !== undefined) ? n.toLocaleString() + '명' : '-'; }
  function pct(n) { return (n !== null && n !== undefined) ? (n > 0 ? '+' : '') + n.toFixed(1) + '%' : '-'; }
  function pctColor(n) { return n > 0 ? '#2E7D32' : n < 0 ? '#C62828' : '#666'; }
  function pctBg(n) { return n > 0 ? '#E8F5E9' : n < 0 ? '#FFEBEE' : '#F5F5F5'; }

  let html = '';

  // 헤더
  html += '<div style="background:#1565C0;border-radius:10px;padding:13px 14px;margin-bottom:10px;color:#fff">';
  html += '<div style="font-size:9px;color:rgba(255,255,255,0.8);margin-bottom:4px">📊 제주 입도객 현황</div>';
  html += '<div style="font-size:13px;font-weight:700;margin-bottom:4px">' + v.period + '</div>';
  html += '<div style="font-size:10px;color:rgba(255,255,255,0.85);line-height:1.5">제주관광협회 일별통계(잠정치) 기반</div>';
  html += '</div>';

  // 섹션 렌더링 함수
  function renderSection(title, icon, data) {
    if (!data) return '';
    let s = '';
    s += '<div style="background:#fff;border-radius:10px;padding:12px 13px;margin-bottom:8px;border:1px solid #EBEBEB">';
    s += '<div style="font-size:10px;color:#1565C0;font-weight:700;margin-bottom:10px">' + icon + ' ' + title + ' · ' + data.label + '</div>';

    // 2026 vs 2025 비교 표 형식
    if (data.current2026 && data.prev2025) {
      // 헤더 행
      s += '<div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:4px;font-size:9px;color:#888;font-weight:600;padding:5px 0;border-bottom:1px solid #EBEBEB;margin-bottom:5px;text-align:right">';
      s += '<div style="text-align:left">구분</div><div>총계</div><div>내국인</div><div>외국인</div>';
      s += '</div>';
      // 2026 (월계/연누계는 일평균 괄호 표시)
      s += '<div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:4px;font-size:11px;padding:6px 0;text-align:right">';
      s += '<div style="text-align:left;color:#1565C0;font-weight:700">2026년</div>';
      if (data.avg) {
        s += '<div style="font-weight:700">' + fmt(data.current2026.total).replace('명','') + '<br><span style="font-size:8px;color:#888;font-weight:500">(' + data.avg.total.toLocaleString() + '/일)</span></div>';
        s += '<div>' + fmt(data.current2026.domestic).replace('명','') + '<br><span style="font-size:8px;color:#888;font-weight:500">(' + data.avg.domestic.toLocaleString() + '/일)</span></div>';
        s += '<div>' + fmt(data.current2026.foreign).replace('명','') + '<br><span style="font-size:8px;color:#888;font-weight:500">(' + data.avg.foreign.toLocaleString() + '/일)</span></div>';
      } else {
        s += '<div style="font-weight:700">' + fmt(data.current2026.total).replace('명','') + '</div>';
        s += '<div>' + fmt(data.current2026.domestic).replace('명','') + '</div>';
        s += '<div>' + fmt(data.current2026.foreign).replace('명','') + '</div>';
      }
      s += '</div>';
      // 2025
      s += '<div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:4px;font-size:11px;padding:5px 0;text-align:right;color:#888">';
      s += '<div style="text-align:left;color:#666;font-weight:600">2025년</div>';
      s += '<div>' + fmt(data.prev2025.total).replace('명','') + '</div>';
      s += '<div>' + fmt(data.prev2025.domestic).replace('명','') + '</div>';
      s += '<div>' + fmt(data.prev2025.foreign).replace('명','') + '</div>';
      s += '</div>';
      // 증감
      if (data.change) {
        s += '<div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:4px;font-size:11px;padding:7px 0 3px 0;text-align:right;border-top:1px solid #EBEBEB;margin-top:3px">';
        s += '<div style="text-align:left;font-weight:700;color:#333">전년比</div>';
        s += '<div style="font-weight:700;padding:2px 4px;border-radius:3px;background:' + pctBg(data.change.total) + ';color:' + pctColor(data.change.total) + '">' + pct(data.change.total) + '</div>';
        s += '<div style="font-weight:700;padding:2px 4px;border-radius:3px;background:' + pctBg(data.change.domestic) + ';color:' + pctColor(data.change.domestic) + '">' + pct(data.change.domestic) + '</div>';
        s += '<div style="font-weight:700;padding:2px 4px;border-radius:3px;background:' + pctBg(data.change.foreign) + ';color:' + pctColor(data.change.foreign) + '">' + pct(data.change.foreign) + '</div>';
        s += '</div>';
      }
    } else if (data.current2026) {
      // 기사 기반 단순 표시
      s += '<div style="font-size:11px;line-height:1.7">';
      if (data.current2026.total) s += '<div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid #F5F5F5"><span>총계</span><span style="font-weight:700">' + fmt(data.current2026.total) + '</span></div>';
      if (data.current2026.domestic) s += '<div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid #F5F5F5"><span>└ 내국인</span><span>' + fmt(data.current2026.domestic) + '</span></div>';
      if (data.current2026.foreign) s += '<div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid #F5F5F5"><span>└ 외국인</span><span>' + fmt(data.current2026.foreign) + '</span></div>';
      if (data.change) {
        if (data.change.total) s += '<div style="display:flex;justify-content:space-between;padding:4px 0"><span>전년比 총계</span><span style="font-weight:700;color:' + pctColor(data.change.total) + '">' + pct(data.change.total) + '</span></div>';
        if (data.change.domestic) s += '<div style="display:flex;justify-content:space-between;padding:4px 0"><span>전년比 내국인</span><span style="font-weight:700;color:' + pctColor(data.change.domestic) + '">' + pct(data.change.domestic) + '</span></div>';
        if (data.change.foreign) s += '<div style="display:flex;justify-content:space-between;padding:4px 0"><span>전년比 외국인</span><span style="font-weight:700;color:' + pctColor(data.change.foreign) + '">' + pct(data.change.foreign) + '</span></div>';
      }
      s += '</div>';
      if (data.src) s += '<div style="font-size:8px;color:#999;margin-top:6px;border-top:1px solid #F5F5F5;padding-top:5px">출처: ' + data.src + '</div>';
    }
    s += '</div>';
    return s;
  }

  // 일계 (당일)
  html += renderSection('일계 (당일)', '📅', v.daily);
  // 월계
  html += renderSection('월계 (이번 달 누적)', '📆', v.monthly);
  // 누계 (연간)
  html += renderSection('연 누계 (1.1~)', '📈', v.yearly);

  // 전주대비 (week-over-week) - 총·내·외 + 일평균
  if (v.weekOverWeek) {
    var wow = v.weekOverWeek;
    html += '<div style="background:#fff;border-radius:10px;padding:12px 13px;margin-bottom:8px;border:1px solid #EBEBEB">';
    html += '<div style="font-size:10px;color:#1565C0;font-weight:700;margin-bottom:10px">📊 전주대비 · ' + wow.label + '</div>';
    
    if (wow.current) {
      // 헤더 행
      html += '<div style="display:grid;grid-template-columns:1.1fr 1fr 1fr 1fr;gap:4px;font-size:9px;color:#888;font-weight:600;padding:5px 0;border-bottom:1px solid #EBEBEB;margin-bottom:5px;text-align:right">';
      html += '<div style="text-align:left">구분</div><div>총계</div><div>내국인</div><div>외국인</div>';
      html += '</div>';
      
      // 이번 주 (주간 합계 + 일평균)
      html += '<div style="display:grid;grid-template-columns:1.1fr 1fr 1fr 1fr;gap:4px;font-size:10px;padding:6px 0;text-align:right">';
      html += '<div style="text-align:left;color:#1565C0;font-weight:700">이번 주</div>';
      html += '<div style="font-weight:700;color:#1565C0">' + wow.current.total.toLocaleString() + '<br><span style="font-size:8px;color:#888;font-weight:500">(' + wow.current.avg.total.toLocaleString() + '/일)</span></div>';
      html += '<div style="font-weight:600">' + wow.current.domestic.toLocaleString() + '<br><span style="font-size:8px;color:#888;font-weight:500">(' + wow.current.avg.domestic.toLocaleString() + '/일)</span></div>';
      html += '<div style="font-weight:600">' + wow.current.foreign.toLocaleString() + '<br><span style="font-size:8px;color:#888;font-weight:500">(' + wow.current.avg.foreign.toLocaleString() + '/일)</span></div>';
      html += '</div>';
      
      if (wow.previous) {
        // 전주
        html += '<div style="display:grid;grid-template-columns:1.1fr 1fr 1fr 1fr;gap:4px;font-size:10px;padding:6px 0;text-align:right;color:#888">';
        html += '<div style="text-align:left;color:#666;font-weight:600">' + wow.previous.label + '</div>';
        html += '<div>' + wow.previous.total.toLocaleString() + '</div>';
        html += '<div>' + wow.previous.domestic.toLocaleString() + '</div>';
        html += '<div>' + wow.previous.foreign.toLocaleString() + '</div>';
        html += '</div>';
        
        // 변화율
        if (wow.change) {
          function chColor(n) { return n > 0 ? '#2E7D32' : n < 0 ? '#C62828' : '#666'; }
          function chBg(n) { return n > 0 ? '#E8F5E9' : n < 0 ? '#FFEBEE' : '#F5F5F5'; }
          function chFmt(n) { return (n > 0 ? '+' : '') + n.toFixed(1) + '%'; }
          html += '<div style="display:grid;grid-template-columns:1.1fr 1fr 1fr 1fr;gap:4px;font-size:10px;padding:7px 0 3px 0;text-align:right;border-top:1px solid #EBEBEB;margin-top:3px">';
          html += '<div style="text-align:left;font-weight:700;color:#333">전주대비</div>';
          html += '<div style="font-weight:700;padding:2px 4px;border-radius:3px;background:' + chBg(wow.change.total) + ';color:' + chColor(wow.change.total) + '">' + chFmt(wow.change.total) + '</div>';
          html += '<div style="font-weight:700;padding:2px 4px;border-radius:3px;background:' + chBg(wow.change.domestic) + ';color:' + chColor(wow.change.domestic) + '">' + chFmt(wow.change.domestic) + '</div>';
          html += '<div style="font-weight:700;padding:2px 4px;border-radius:3px;background:' + chBg(wow.change.foreign) + ';color:' + chColor(wow.change.foreign) + '">' + chFmt(wow.change.foreign) + '</div>';
          html += '</div>';
        }
      } else if (wow.note) {
        html += '<div style="background:#FFF8E1;border-radius:6px;padding:7px 10px;margin-top:8px;font-size:9px;color:#5D4037;line-height:1.5">💡 ' + wow.note + '</div>';
      }
    }
    html += '</div>';
  }

  // 출처 안내
  html += '<div style="background:#FFF8E1;border-radius:8px;padding:10px 12px;margin-top:10px;border-left:3px solid #F9A825">';
  html += '<div style="font-size:10px;color:#5D4037;font-weight:600;margin-bottom:4px">📌 데이터 출처</div>';
  html += '<div style="font-size:9px;color:#5D4037;line-height:1.6">';
  html += '※ <a href="https://visitjeju.or.kr/issue/stats/daily.htm" target="_blank" style="color:#1565C0;font-weight:600">제주관광협회 일별통계</a> (잠정치, 매주 일요일 갱신)<br>';
  html += '※ 산정 방법: 항공 + 연안여객 + 크루즈 입도객<br>';
  html += '※ 일별통계는 잠정치, 월간 확정치와 다를 수 있습니다';
  html += '</div></div>';

  return html;
}

// Google News RSS — 키워드별 검색 (모든 한국 언론사 자동 수집)

// 권역 키워드 매핑

function detectRegion(text) {
  for (const [region, kws] of Object.entries(REGION_KEYWORDS)) {
    if (kws.some(k => text.includes(k))) return region;
  }
  return '전체';
}

function parseDate(str) {
  try {
    return new Date(str);
  } catch(e) { return new Date(0); }
}

// ── PWA Service Worker 등록 + 자동 업데이트
if('serviceWorker' in navigator){
  window.addEventListener('load', async () => {
    try {
      const reg = await navigator.serviceWorker.register('/sw.js');
      // 새 버전 감지 시 자동 업데이트
      reg.addEventListener('updatefound', () => {
        const newWorker = reg.installing;
        newWorker.addEventListener('statechange', () => {
          if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
            // 새 버전 있음 → 즉시 적용
            newWorker.postMessage('skipWaiting');
            window.location.reload();
          }
        });
      });
      // 주기적 업데이트 체크 (앱 열 때마다)
      reg.update();
    } catch(e) {}
  });
}
